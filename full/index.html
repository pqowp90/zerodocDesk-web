<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- Scripts only from this page's own files: an injected <script>, onclick= or eval never runs.
       wss: for the Nostr relays (configurable), 'self' for the desktop/LAN WebSocket. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>DeskDoc</title>
  <!-- installable app (PWA) on phones; app.js keeps theme-color in step with the theme -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1e2026">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DeskDoc">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <!-- items with data-bar: order and visibility come from this PC's settings (topbar.rs);
       the rest (remote button, chat/terminal switch) stay fixed at the right end -->
  <header id="bar">
    <button id="side-toggle" data-bar="side_toggle" data-key="toggle_side" class="icon" data-i18n-title="top.side_toggle.tip">☰</button>
    <div id="tabs" data-bar="tabs"></div>
    <button id="new-claude" data-bar="new_claude" data-key="new_tab" class="act" data-i18n-title="top.new_claude.tip">+ Claude</button>
    <button id="new-shell" data-bar="new_shell" class="act ghost" data-i18n-title="top.new_shell.tip"><span data-i18n="top.new_shell.label"></span></button>
    <!-- fixed. Desktop window: opens settings › remote, the dot is green while another device is connected.
         Other devices (no remote settings there): just the dot, green while connected to the desktop. -->
    <button id="remote-btn" type="button" class="act ghost" data-i18n-title="top.remote.tip"><span id="conn" class="dot off"></span><span class="rlabel" data-i18n="top.remote.label"></span></button>
    <!-- a Claude tab is either the conversation (with the input box) or the raw terminal -->
    <div id="mode" data-key="toggle_chat" data-i18n-title="top.mode.tip">
      <button type="button" data-mode="chat" data-i18n="top.mode_chat.label"></button>
      <button type="button" data-mode="term" data-i18n="top.mode_term.label"></button>
    </div>
  </header>

  <div id="workspace">
    <!-- desktop window only: floats at the top-right corner, under the window buttons -->
    <button id="update-btn" type="button" class="act" data-i18n="top.update.label" hidden></button>
    <aside id="side">
      <div class="side-head">
        <span data-i18n="side.projects.title"></span>
        <button id="add-folder" class="icon" data-i18n-title="side.add_folder.tip">＋</button>
        <button id="refresh-projects" class="icon" data-i18n-title="side.refresh.tip">⟳</button>
      </div>
      <div id="projects"><div class="side-empty" data-i18n="side.loading.text"></div></div>
      <div class="side-foot">
        <button id="settings-btn" type="button" data-i18n-title="side.settings.tip"><span class="gear">⚙</span><span data-i18n="side.settings.label"></span></button>
      </div>
    </aside>
    <div id="main-col">
      <main id="terms"><div id="chat" tabindex="0"><div id="chat-col"></div></div>
        <!-- over the chat's scrollbar: where each question and compaction is; hover = preview, click = go -->
        <div id="chat-rail" hidden></div></main>
      <!-- input box: a normal text field (selection, Ctrl+A, IME, images); sent to the active tab -->
      <form id="compose" autocomplete="off">
        <!-- messages held until the active Claude tab finishes ("끝나면 전송") -->
        <!-- the active conversation's subagents that are working now, and what each is doing -->
        <div id="agent-list" hidden></div>
        <div id="queue-list"></div>
        <div class="cbox">
          <!-- completions while typing a /command or an @file, like Claude Code's prompt -->
          <div id="ac-list" hidden></div>
          <!-- phone: Claude Code's suggested next message, tap to put it in the box (desktop: Tab) -->
          <button type="button" id="suggest-chip" hidden></button>
          <div id="quote-list"></div>
          <div id="attach-list"></div>
          <textarea id="compose-text" rows="1" spellcheck="false"
            data-i18n-ph="compose.text.ph"></textarea>
          <div class="cbar">
            <button type="button" id="attach-btn" class="cicon" data-i18n-title="compose.attach.tip">＋</button>
            <!-- AI model for Claude tabs: new tabs start with it; an idle Claude tab switches right away -->
            <div class="mpick">
              <button type="button" id="model-btn" data-i18n-title="compose.model.tip"><span id="model-name"></span><span id="model-eff"></span><svg class="caret" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
              <div id="model-menu" hidden>
                <div class="mm-h" data-i18n="compose.model_menu.models_head"></div>
                <div id="mm-models"></div>
                <div class="mm-h" data-i18n="compose.model_menu.efforts_head"></div>
                <div id="mm-efforts"></div>
              </div>
            </div>
            <!-- this conversation's share of the session / weekly limits -->
            <span id="chat-share" hidden></span>
            <span id="opt-hint"></span>
            <span class="cgap"></span>
            <!-- how full this conversation's context is; click = details and "summarize now" (/compact) -->
            <div class="mpick" id="ctx-pick" hidden>
              <button type="button" id="chat-ctx"></button>
              <div id="ctx-menu" hidden>
                <div class="mm-h" data-i18n="compose.ctx_menu.head"></div>
                <div id="ctx-info"></div>
                <div class="ctx-note" data-i18n="compose.ctx_menu.note"></div>
                <button type="button" id="compact-btn" class="cpill" data-i18n="compose.compact.label"></button>
                <div id="compact-why" class="ctx-note" hidden></div>
              </div>
            </div>
            <!-- Claude Code's permission mode (Shift+Tab in its terminal), for the active Claude tab -->
            <div class="mpick" id="mode-pick" hidden>
              <button type="button" id="mode-btn" data-i18n-title="compose.mode.tip"><span id="mode-ico" class="mico"></span><span id="mode-name"></span><svg class="caret" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
              <div id="mode-menu" hidden></div>
            </div>
            <button type="button" id="queue-btn" class="cpill ghost" data-i18n-title="compose.queue.tip" data-i18n="compose.queue.label" hidden></button>
            <button type="button" id="now-btn" class="cpill" data-i18n-title="compose.now.tip" data-i18n="compose.now.label" hidden></button>
            <!-- icons are inline SVG, not text glyphs: → and ■ sit off-center and change size per font -->
            <button type="button" id="stop-btn" class="cround stop" data-i18n-title="compose.stop.tip" data-i18n-aria="compose.stop.aria" hidden><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="currentColor"/></svg></button>
            <button type="submit" id="send-btn" class="cround" data-i18n-title="compose.send.tip" data-i18n-aria="compose.send.aria"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12.5 5.5 19 12l-6.5 6.5"/></svg></button>
          </div>
        </div>
        <input type="file" id="attach-file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
      </form>
    </div>
  </div>

  <!-- status bar across the bottom of the window. Left: the active tab's state (working / waiting on a
       menu / idle, and since when), then its Claude account (click = switch). Right: Claude plan usage (5-hour session / week) like /usage; click = check now.
       The active conversation's own numbers sit in the input box (#chat-share, #chat-ctx). -->
  <footer id="status">
    <span id="tab-state" hidden></span>
    <button type="button" id="account" hidden></button>
    <span class="cgap"></span>
    <button type="button" id="usage" hidden></button>
  </footer>

  <!-- touch devices only: keys a phone keyboard doesn't have -->
  <nav id="keys">
    <button data-k="esc">Esc</button>
    <button data-k="tab">Tab</button>
    <button data-k="stab" data-i18n-title="keybar.stab.tip">⇧Tab</button>
    <button data-k="up">↑</button>
    <button data-k="down">↓</button>
    <button data-k="ctrlc">^C</button>
    <button data-k="nl" data-i18n-title="keybar.nl.tip" data-i18n="keybar.nl.label"></button>
    <button data-k="enter">Enter</button>
  </nav>

  <!-- settings: one dialog, a pane per topic -->
  <div id="settings" hidden>
   <div class="set-box" role="dialog" data-i18n-aria="settings.dialog.aria">
    <nav class="set-nav">
      <h2 data-i18n="settings.nav.title"></h2>
      <button type="button" data-pane="display" data-i18n="settings.nav_display.label"></button>
      <button type="button" data-pane="notify" data-i18n="settings.nav_notify.label"></button>
      <button type="button" data-pane="shortcuts" data-i18n="settings.nav_shortcuts.label"></button>
      <button type="button" data-pane="skills" data-i18n="settings.nav_skills.label"></button>
      <button type="button" data-pane="remote" data-i18n="settings.nav_remote.label"></button>
      <button type="button" data-pane="update" data-i18n="settings.nav_update.label"></button>
    </nav>
    <button id="settings-close" class="icon" type="button" data-i18n-title="settings.close.tip">×</button>
    <div class="set-body">

  <section id="display" class="pane" hidden>
    <h2 data-i18n="settings.display.title"></h2>
    <p class="hint" data-i18n="settings.display.theme_hint"></p>
    <div class="theme-pick">
      <button type="button" class="theme-opt" data-theme="dark"><span class="tprev"></span><span data-i18n="settings.display.dark_label"></span></button>
      <button type="button" class="theme-opt" data-theme="light"><span class="tprev"></span><span data-i18n="settings.display.light_label"></span></button>
    </div>
    <!-- this PC's theme colors (desktop window only; theme.rs) -->
    <div id="color-set" hidden>
      <h2 class="sub" data-i18n="settings.display.colors_title"></h2>
      <p class="hint" data-i18n="settings.display.colors_hint"></p>
      <div id="theme-cards"></div>
    </div>
    <div class="set-row"><label class="sw"><input type="checkbox" id="chat-usage"><span></span></label><label for="chat-usage"><span data-i18n="settings.display.chat_usage_label"></span><span class="hint" data-i18n="settings.display.chat_usage_hint"></span></label></div>
    <div class="set-row" id="link-browser-row" hidden><select id="link-browser"><option value="chrome" data-i18n="settings.display.link_browser_chrome"></option><option value="default" data-i18n="settings.display.link_browser_default"></option><option value="edge" data-i18n="settings.display.link_browser_edge"></option></select><label for="link-browser"><span data-i18n="settings.display.link_browser_label"></span><span class="hint" data-i18n="settings.display.link_browser_hint"></span></label></div>
    <div class="set-row" id="menu-ko-row" hidden><label class="sw"><input type="checkbox" id="menu-translate"><span></span></label><label for="menu-translate"><span data-i18n="settings.display.menu_translate_label"></span><span class="hint" data-i18n="settings.display.menu_translate_hint"></span></label></div>
    <!-- hosted page (phones) only: install as an app, and on iPhone move the pairing into it -->
    <div id="install-set" hidden>
      <h2 class="sub" data-i18n="settings.install.title"></h2>
      <p class="hint" id="install-hint"></p>
      <div class="set-row">
        <button id="install-btn" class="act" type="button" data-i18n="settings.install.button" hidden></button>
        <button id="move-btn" class="act ghost" type="button" data-i18n="settings.install.move_button" hidden></button>
      </div>
    </div>
    <div id="bar-set">
      <h2 class="sub" data-i18n="settings.bar.title"></h2>
      <p class="hint" data-i18n="settings.bar.hint"></p>
      <div id="bar-items"></div>
      <div class="set-row"><button id="bar-reset" class="act ghost" type="button" data-i18n="settings.bar.reset_button"></button></div>
      <h2 class="sub" data-i18n="settings.buttons.title"></h2>
      <p class="hint" data-i18n="settings.buttons.hint"></p>
      <button id="buttons-folder" class="act ghost" type="button" data-i18n="settings.buttons.folder_button"></button>
    </div>
  </section>

  <section id="shortcuts" class="pane" hidden>
    <h2 data-i18n="settings.shortcuts.title"></h2>
    <p class="hint" id="keys-hint" data-i18n="settings.shortcuts.hint"></p>
    <p class="hint" id="keys-ro" data-i18n="settings.shortcuts.readonly_hint" hidden></p>
    <div id="key-rows"></div>
    <div class="set-row"><button id="keys-reset" class="act ghost" type="button" data-i18n="settings.shortcuts.reset_button"></button></div>
  </section>

  <section id="notify" class="pane" hidden>
    <h2 data-i18n="settings.notify.title"></h2>
    <p class="hint" data-i18n="settings.notify.hint"></p>
    <div class="set-row"><label class="sw"><input type="checkbox" id="notify-os"><span></span></label><label for="notify-os"><span data-i18n="settings.notify.os_label"></span><span class="hint" data-i18n="settings.notify.os_hint"></span></label></div>
    <div class="set-row"><button id="notify-test" class="act ghost" type="button" data-i18n="settings.notify.test_button"></button></div>
    <p class="hint" data-i18n="settings.notify.help_hint"></p>
  </section>

  <section id="remote" class="pane" hidden>
    <h2 data-i18n="remote.p2p.title"></h2>
    <p class="hint"><span data-i18n="remote.p2p.hint_before_url"></span><b id="web-url"></b><span data-i18n="remote.p2p.hint_after_url"></span></p>
    <button id="pair-btn" class="act" data-i18n="remote.pair.button"></button>
    <div id="pair-box" hidden>
      <div id="pair-qr"></div>
      <p class="hint" id="pair-ttl"></p>
    </div>
    <div id="paired"></div>
    <p class="hint" id="peers"></p>

    <h2 class="sub" data-i18n="remote.turn.title"></h2>
    <p class="hint" data-i18n="remote.turn.hint"></p>
    <p class="hint" id="turn-state"></p>
    <form id="turn-form" autocomplete="off">
      <input id="turn-id" data-i18n-ph="remote.turn.id_ph" spellcheck="false">
      <input id="turn-token" type="password" data-i18n-ph="remote.turn.token_ph" spellcheck="false">
      <div class="set-row">
        <button class="act" type="submit" id="turn-save" data-i18n="remote.turn.save_button"></button>
        <button class="act ghost" type="button" id="turn-clear" data-i18n="remote.turn.clear_button" hidden></button>
      </div>
    </form>

    <h2 class="sub" data-i18n="remote.lan.title"></h2>
    <label class="switch"><input type="checkbox" id="remote-on"> <span data-i18n="remote.lan.allow_label"></span></label>
    <div id="remote-urls"></div>
    <p class="hint" data-i18n="remote.lan.token_hint"></p>
  </section>

  <!-- skills = Claude Code plugins; account (user scope) or one project (local scope, just me) -->
  <section id="skills" class="pane" hidden>
    <h2 data-i18n="skills.title"></h2>
    <div class="sk-scope">
      <button type="button" data-scope="user" data-i18n="skills.scope_user.label"></button>
      <button type="button" data-scope="local" data-i18n="skills.scope_local.label"></button>
      <select id="sk-proj" data-i18n-title="skills.project.tip"></select>
    </div>
    <p class="hint" id="sk-hint"></p>
    <div id="sk-market"></div>
    <div id="sk-list"><div class="side-empty" data-i18n="skills.loading.text"></div></div>
    <h3 class="sk-sub" data-i18n="skills.search.title"></h3>
    <input id="sk-q" type="search" data-i18n-ph="skills.search.ph" autocomplete="off" spellcheck="false">
    <div id="sk-cats"></div>
    <div id="sk-results"></div>
    <details id="sk-more">
      <summary data-i18n="skills.add_repo.summary"></summary>
      <form id="sk-add" autocomplete="off">
        <input id="sk-repo" placeholder="GitHub owner/repo" spellcheck="false">
        <button class="act" type="submit" data-i18n="skills.add_repo.button"></button>
      </form>
    </details>
    <p class="hint" data-i18n="skills.apply_hint"></p>
  </section>

  <section id="update" class="pane" hidden>
    <h2 id="upd-title" data-i18n="update.title"></h2>
    <p id="upd-ver"></p>
    <ul id="upd-notes"></ul>
    <div id="upd-bar" hidden><div></div></div>
    <p class="hint" id="upd-state"></p>
    <p class="hint" id="upd-error" hidden></p>
    <div id="upd-actions"></div>
    <div id="upd-mode" hidden>
      <h3 data-i18n="settings.update.when"></h3>
      <div class="set-row"><input type="radio" name="upd-mode" id="upd-mode-wait" value="wait"><label for="upd-mode-wait"><span data-i18n="update.mode_wait.label"></span><span class="hint" data-i18n="update.mode_wait.hint"></span></label></div>
      <div class="set-row"><input type="radio" name="upd-mode" id="upd-mode-resume" value="resume"><label for="upd-mode-resume"><span data-i18n="update.mode_resume.label"></span><span class="hint" data-i18n="update.mode_resume.hint"></span></label></div>
    </div>
  </section>

    </div>
   </div>
  </div>

  <div id="toast" hidden></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/nostr.bundle.js"></script>
  <script src="p2p.js"></script>
  <!-- The web client, in order: classic scripts sharing one global scope (no modules, no bundler).
       Code that runs while a file loads may only use what earlier files define. -->
  <script src="js/strings.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/connect.js"></script>
  <script src="js/compose.js"></script>
  <script src="js/compose-bar.js"></script>
  <script src="js/status.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-live.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
